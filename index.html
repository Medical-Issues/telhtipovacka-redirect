<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TELHTipovačka – Přesměrování na novou adresu</title>
  <meta http-equiv="refresh" content="0; url=https://telhtipovacka.duckdns.org/">
  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --border: #23314f;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #e11d48;
      --accent-hover: #be123c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #17233c 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.25rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fda4af;
      background: rgba(225, 29, 72, 0.15);
      border: 1px solid rgba(225, 29, 72, 0.35);
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.1rem;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.65rem;
    }

    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
      margin-bottom: 1.6rem;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn {
      display: inline-block;
      width: 100%;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.8rem 1.25rem;
      border-radius: 10px;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:active {
      transform: scale(0.99);
    }

    .url-hint {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #64748b;
      word-break: break-all;
    }
  </style>
  <script>
    (function () {
      var target = "https://telhtipovacka.duckdns.org" + window.location.pathname + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <main class="card">
    <span class="badge">Nový server • 24/7 provoz</span>
    <h1>TELHTipovačka</h1>
    <p>Přestěhovali jsme se na rychlejší server bez uspávání. Za okamžik tě automaticky přesměrujeme.</p>
    <div class="spinner" aria-hidden="true"></div>
    <a id="fallback-link" class="btn" href="https://telhtipovacka.duckdns.org/">Přejít na novou adresu</a>
    <div class="url-hint">telhtipovacka.duckdns.org</div>
  </main>

  <script>
    document.getElementById("fallback-link").href =
      "https://telhtipovacka.duckdns.org" + window.location.pathname + window.location.search + window.location.hash;
  </script>
</body>
</html>
